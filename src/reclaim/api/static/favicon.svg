<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Reclaim">
  <!--
    Reclaim mark v3 (tab-icon-sized copy of logo.svg) — see that file's comment for the full
    palette/depth rationale. Literal hex values (not CSS custom properties) because a favicon is
    loaded as a standalone document outside the app's stylesheet cascade; these mirror
    tokens.css's rc-mark, rc-brand, and rc-bg custom properties exactly (light mode) with a
    prefers-color-scheme override for the dark-mode tab-bar case.

    NOTE: no literal double-hyphen anywhere in this comment (invalid inside an XML/SVG comment;
    Chrome silently fails to render the whole file — see logo.svg's comment for why).
  -->
  <defs>
    <linearGradient id="rc-grad-indigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="rc-grad-mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>
  </defs>
  <style>
    .rc-ground { fill: url(#rc-grad-indigo); }
    .rc-reclaimed { fill: url(#rc-grad-mint); }
    .rc-lift { fill: #6366f1; stroke: #f6f7fb; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .rc-lift { stroke: #0f1117; }
    }
  </style>
  <clipPath id="rc-mark-clip">
    <rect width="32" height="32" rx="7" />
  </clipPath>
  <g clip-path="url(#rc-mark-clip)">
    <rect class="rc-ground" x="0" y="0" width="32" height="32" />
    <rect class="rc-reclaimed" x="11" y="11" width="21" height="21" />
    <rect class="rc-lift" x="15" y="1" width="14" height="12" />
  </g>
</svg>
