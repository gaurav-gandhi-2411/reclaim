<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Reclaim">
  <!--
    Reclaim mark v4 (visual identity PIVOT): an isometric stack of disk platters, the top one
    lifted free in amber — "reclaimed space" made literal, replacing v3's indigo/mint flat-
    rectangle "occupied ground" metaphor entirely. Palette: deep #1B6FA8, mid #2E9BD6, amber
    #F2A93B, decomposed directly from reclaim_lifted_platter_asset_set.svg (repo root) — each
    platter is one <ellipse> (its top face) painted over one <path> "band" (its visible front
    rim: a flat-sided rectangle whose bottom edge bulges into a half-ellipse arc, exactly the
    reference SVG's own M/L/A/L/A/Z path shape). Geometry ratios (ry/rx, inter-platter gaps)
    measured off that reference file — see packaging/build_brand_assets.py's module docstring
    for the full derivation, since both this file and that script's raster renderer share the
    same source geometry.

    This is the "larger" in-app copy (header + overlay use, 28-40px) — kept at the full
    3-platter form. favicon.svg is the browser-tab copy, simplified to 2 platters per the
    explicit size-behavior spec (amber lifted platter + one combined blue platter beneath,
    matching the reference SVG's own dedicated "16px" panel) — these two files now
    deliberately DIFFER in platter count, unlike v1-v3 where they were pixel-identical copies;
    see favicon.svg's own comment for why.

    NOTE: two hyphens in a row are NOT safe inside an XML/SVG comment (invalid per the XML spec;
    Chrome silently fails to render the whole file — a real bug this project already hit once,
    see PLAN.md's 2026-07-23 late checkpoint). Use the em dash character above instead, in this
    comment and any future edit to it.
  -->
  <g>
    <!-- Bottom platter (darkest, base of the stack). -->
    <path d="M5.70 22.03 L5.70 25.74 A10.30 3.71 0 0 0 26.30 25.74 L26.30 22.03 A10.30 3.71 0 0 1 5.70 22.03 Z" fill="#124C74" />
    <ellipse cx="16" cy="22.03" rx="10.30" ry="3.71" fill="#1B6FA8" />
    <!-- Middle platter (still stacked). -->
    <path d="M5.70 15.54 L5.70 19.25 A10.30 3.71 0 0 0 26.30 19.25 L26.30 15.54 A10.30 3.71 0 0 1 5.70 15.54 Z" fill="#1B6FA8" />
    <ellipse cx="16" cy="15.54" rx="10.30" ry="3.71" fill="#2E9BD6" />
    <!-- Top platter (amber, lifted free — the reclaimed space). -->
    <path d="M5.70 6.27 L5.70 9.98 A10.30 3.71 0 0 0 26.30 9.98 L26.30 6.27 A10.30 3.71 0 0 1 5.70 6.27 Z" fill="#C2801F" />
    <ellipse cx="16" cy="6.27" rx="10.30" ry="3.71" fill="#F2A93B" />
  </g>
</svg>
