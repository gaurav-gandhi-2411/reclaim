<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Reclaim">
  <!--
    Reclaim mark v2: "a block lifted away from a filled square" — same geometry as v1, new
    palette + dimensional depth (WS-B visual identity refresh). The whole square starts a
    burnished copper (occupied ground); a chunk in the bottom-right has already been cleared,
    revealing jade underneath. The small copper block floating top-right, outlined in the
    surface color, is the piece mid-lift — still occupied, but on its way out.

    Depth: a top-lit vertical gradient on the two large regions (copper, jade) — restrained,
    analogous-hue (light-to-dark within the same color, not a rainbow), matching 2026 icon
    convention of "depth without losing small-size legibility" (see PLAN.md's WS-B research
    note). The lift block is a FLAT fill, not a nested gradient: proven empirically (see the
    WS-B preview branch) that a second gradient inside a box this small degenerates to nothing
    once rasterized at 16px — one flat tone plus one outline reads at every size; a nested
    highlight inside about 7px does not. packaging/build_brand_assets.py's raster renderer
    mirrors this: gradient at 48px+, flat below (same legibility reasoning, since PIL can't
    rely on a resolution-independent renderer the way this SVG can).

    NOTE: two hyphens in a row are NOT safe inside an XML/SVG comment (invalid per the XML spec;
    Chrome silently fails to render the whole file — a real bug this project already hit once,
    see PLAN.md's 2026-07-23 late checkpoint). Use the em dash character above instead, in this
    comment and any future edit to it.

    Same geometry as favicon.svg (this is the larger in-app copy).
  -->
  <defs>
    <linearGradient id="rc-grad-copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9702f" />
      <stop offset="1" stop-color="#8a3f16" />
    </linearGradient>
    <linearGradient id="rc-grad-jade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34b378" />
      <stop offset="1" stop-color="#167048" />
    </linearGradient>
  </defs>
  <style>
    .rc-ground { fill: url(#rc-grad-copper); }
    .rc-reclaimed { fill: url(#rc-grad-jade); }
    .rc-lift { fill: #c9702f; stroke: #f6f3ee; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .rc-lift { stroke: #16130f; }
    }
  </style>
  <clipPath id="rc-logo-clip">
    <rect width="32" height="32" rx="7" />
  </clipPath>
  <g clip-path="url(#rc-logo-clip)">
    <rect class="rc-ground" x="0" y="0" width="32" height="32" />
    <rect class="rc-reclaimed" x="11" y="11" width="21" height="21" />
    <rect class="rc-lift" x="15" y="1" width="14" height="12" />
  </g>
</svg>
