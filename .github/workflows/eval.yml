name: eval

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      # Routed through scripts/git_guard.py with GIT_CONFIG_GLOBAL redirected to a job-scoped
      # temp path — belt-and-suspenders identity for any fixture code that ever grows a
      # `git commit` without -c-scoped identity (evals/fixtures/build_golden_tree.py and
      # tests/test_scanner.py's own git commits are already -c-scoped and need this for
      # nothing). Never writes to a real global config, even here on an ephemeral runner where
      # there's no real profile to protect — the point is that this exact step is safe to copy
      # to a local machine too: without also exporting GIT_CONFIG_GLOBAL, git_guard.py refuses
      # it outright instead of silently clobbering a real developer's identity (see
      # scripts/git_guard.py's docstring for the incident this guards against).
      - name: Configure a SANDBOXED git identity for fixture repos (scripts/git_guard.py)
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}\reclaim-ci-gitconfig
        run: |
          uv run python scripts/git_guard.py config --global user.email "fixture@reclaim.test"
          uv run python scripts/git_guard.py config --global user.name "Reclaim Fixture Builder"

      # Scoped explicitly to these nine safety-gate files, not the whole evals/ directory: every
      # other evals/*.py file is a gold-set/operating-point measurement that needs the [ai]
      # extra (torch/PIL/numpy/datasketch/...) to even collect, and this job deliberately does
      # NOT install it — those measurements run in ci.yml's ai-layer-with-extras job instead
      # (`pytest tests/ evals/test_ai_safety_gate.py -v`, extras installed there). None of the
      # nine needs the ai extra: test_safety_gate.py tests the deterministic engine's
      # SafetyValidator hard gate directly; test_ai_safety_gate.py constructs
      # AICluster/AIClusterMember objects with hardcoded scores to prove the structural
      # recommend-only guarantee (never runs a real model); test_safe_mode_gate.py tests the
      # Stage 2 safe/power mode structural boundary via config.py alone; test_apply_safety_preflight.py
      # exercises the real live-process-lock/hardlink-shared-environment pre-flight probes against
      # real fixtures (no model, no mocks); test_apply_batch_call_graph_gate.py is an AST-based
      # static-analysis proof (not a behavioral test) that every filesystem-mutation primitive in
      # executor.py/purge.py is confined to its allowed-home function and that apply_batch's
      # pre-flight guard structurally precedes any mutation it can reach;
      # test_reclaimable_bytes_link_aware_gate.py is a pure `ast`-module structural scan of
      # schemas.py/service.py/cli.py; test_cache_reclaimable_bytes_gate.py exercises
      # `reclaim.detectors`/`reclaim.index` directly against real `os.link()` fixtures;
      # test_mcp_safety_gate.py (R7) proves the MCP control surface never imports
      # reclaim.executor/send2trash directly and that no registered tool schema accepts a raw
      # path/paths parameter -- `mcp` is a core dependency (pyproject.toml), not an `[ai]`-extra
      # one, so this job's plain `uv sync` already installs it. Verified: all nine collect and
      # pass with zero ai deps installed.
      #
      # test_safe_mode_gate.py was added here after a real gap was found: `pyproject.toml`'s
      # `testpaths = ["tests"]` means a bare `pytest` NEVER discovers anything under evals/, so
      # this 18-test file — the actual safe-mode structural gate — had never run in ANY CI job
      # before this, only ever locally if someone happened to invoke it by exact path.
      #
      # test_apply_safety_preflight.py and test_apply_batch_call_graph_gate.py were added here
      # after the identical gap recurred: both were wired into scripts/verify.py's local safety
      # gate list but never into this workflow file, so neither ran in any remote CI job despite
      # being exactly the kind of safety-critical structural gate this job exists to enforce.
      #
      # test_reclaimable_bytes_link_aware_gate.py / test_cache_reclaimable_bytes_gate.py (audit
      # finding E1, 2026-08-21) are added here for the exact same reason — a new safety/
      # correctness gate under evals/ that scripts/verify.py alone runs, but this job's own list
      # never picked up, would be the identical silent-skip gap this docstring already warns
      # about, just for a new file instead of test_safe_mode_gate.py.
      #
      # test_mcp_safety_gate.py is added here up front, at the same time this gate is
      # introduced, specifically to not repeat that exact discoverability gap a second time.
      #
      # test_scan_scope_gate.py (P0 finding, 2026-08-22) is added here up front for the same
      # reason -- proves POST /api/scan/my-files (SIMPLE mode's default "Clean My Computer"
      # action) scans only the invoking user's own profile, never a whole-drive/volume-root
      # traversal, plus a structural check on app.js's own source that the primary button stays
      # wired to it. No [ai] extra needed.
      #
      # test_config_env_var_normalization_gate.py (8.3 short-name P0 fix, 2026-08) is added here
      # up front too, for the same reason: an AST-based structural gate proving every env-var
      # read in config.py routes through `_win_path`'s long-path normalization is exactly the
      # kind of safety-critical check this job exists to run remotely, not just locally via
      # scripts/verify.py. Zero deps beyond stdlib `ast`, no [ai] extra needed.
      #
      # test_data_path_cwd_independence_gate.py (protocol-handler log-path P0 fix, PR #51 + AB1's
      # ten-module generalization) is added here up front too, for the same reason: an AST-based
      # structural gate proving no module under src/reclaim/ builds a bare CWD-relative
      # Path("data/...") literal. Zero deps beyond stdlib `ast`, no [ai] extra needed.
      #
      # test_default_enabled_category_floor_gate.py (AV4, 2026-08-24) is added here up front too,
      # for the same reason: a structural floor against a default-enabled category silently
      # finding zero candidates forever (the shape both PR #50 and PR #76/AU1 hit, via two
      # different mechanisms) is exactly the kind of safety/correctness gate this job exists to
      # run remotely, not just locally via scripts/verify.py. Exercises real `Config()` defaults
      # (real env-var resolution) + a real scanner walk, no [ai] extra needed.
      - name: Safety gates -- deterministic, adversarial, AI recommend-only, MCP recommend/rule-only, safe-mode structural boundary, apply-time pre-flight probes, mutation call-graph confinement, hardlink-aware reclaimable-bytes, default scan-scope boundary, config env-var normalization, data-path CWD independence, and default-enabled-category floor
        run: uv run pytest evals/test_safety_gate.py evals/test_safety_adversarial.py evals/test_ai_safety_gate.py evals/test_safe_mode_gate.py evals/test_apply_safety_preflight.py evals/test_apply_batch_call_graph_gate.py evals/test_reclaimable_bytes_link_aware_gate.py evals/test_cache_reclaimable_bytes_gate.py evals/test_mcp_safety_gate.py evals/test_scan_scope_gate.py evals/test_config_env_var_normalization_gate.py evals/test_data_path_cwd_independence_gate.py evals/test_default_enabled_category_floor_gate.py -v --junitxml=pytest-results.xml

      - name: Fail if this job collected/ran zero tests
        run: uv run python scripts/check_junit_nonzero.py pytest-results.xml
