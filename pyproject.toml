[project]
name = "reclaim"
version = "1.3.0"
description = "Rules-first Windows disk-cleanup tool with hard safety gates and fully recoverable actions."
authors = [
    { name = "Gaurav Gandhi", email = "gaurav.gandhi2411@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "send2trash>=1.8",
    "blake3>=1.0",
    "jinja2>=3.1",
    "httpx>=0.27",  # opt-in update check only (reclaim.update_check) -- see PRIVACY.md's
    # "Updates" section. Previously a test-only dev dependency; this is its first production
    # use, moved here from [dependency-groups] dev below.
]

[project.optional-dependencies]
# Applied-AI layer (reclaim-ai-features-spec.md). The core deterministic tool installs and
# runs without ANY of these — every import is lazy/guarded (reclaim.ai._optional.require),
# so `pip install reclaim` alone never pulls these in. `pip install reclaim[ai]` /
# `uv sync --extra ai` adds them. Grows incrementally as each spec feature lands — Feature 1a
# Track A (pHash/dHash + classical keep-best) needs the first three; Feature 1b (MinHash/LSH
# document near-dup + sentence-embedding residual + version-chain) adds the rest (ADR-0017
# covers licenses); Feature 2 adds rapidocr (ADR-0019); the generic clutter-likelihood ranker
# adds numpy + lightgbm (ADR-0021); Track B (semantic image grouping, browse-only) adds
# onnxruntime + faiss-cpu (ADR-0022, superseded by Wave 1 P0-B below).
#
# Wave 1 P0-B (2026-07-30): torch/open-clip-torch/sentence-transformers DROPPED entirely —
# CLIP and MiniLM now ship as pre-converted, pinned, SHA256-verified ONNX files bundled under
# `reclaim/ai/models/` (see image_embeddings.py/text_embeddings.py's own module docstrings and
# reports/ai/onnx_quality_parity/ for the quality-parity measurement that justified this: CLIP
# as fp16 — bit-identical BCubed grouping quality to the original torch model; MiniLM as
# int8 — quality-equivalent near-dupe detection at the shipped operating threshold). This
# extras group installs the runtime (onnxruntime + the lightweight `tokenizers` package for
# MiniLM's WordPiece tokenization) needed to RUN inference against those bundled files — it
# does NOT include the tooling needed to REGENERATE them from the original checkpoints; that's
# the separate `ai-export` group below, used only by `scripts/export_ai_models.py`.
ai = [
    "imagehash>=4.3",             # BSD-2-Clause — pHash/dHash perceptual hashing
    "opencv-python-headless>=4.9", # Apache-2.0 — Laplacian-variance sharpness scoring
    "pillow>=10.0",                # HPND (permissive) — image I/O, resolution/exposure checks
    "datasketch>=1.6",             # MIT — MinHash/LSH near-dup prefilter (Feature 1b Stage 1)
    "tokenizers>=0.22",             # Apache-2.0 — MiniLM WordPiece tokenization (Feature 1b
    # Stage 2, residual only), the lightweight Rust-backed library sentence-transformers used
    # internally, now used directly against the bundled `minilm_tokenizer.json` — no torch/
    # transformers/sentence-transformers dependency (~7.5MB installed vs. sentence-
    # transformers' full torch-backed stack).
    "python-docx>=1.1",            # MIT — local .docx text extraction, never logged
    "pypdf>=5.0",                  # BSD-3-Clause — local .pdf text extraction, never logged
    "rapidocr-onnxruntime>=1.3",   # Apache-2.0 — local OCR (Feature 2), pip-only (no system
    # binary, unlike Tesseract) — bundled ONNX models, zero network calls at inference time.
    # NOTE: pulls in full `opencv-python` (GUI-capable) as a transitive dependency, which
    # coexists with the `opencv-python-headless` pinned above — both packages provide the
    # `cv2` module; whichever installs last determines the on-disk build, but this has not
    # been observed to break any existing `cv2` usage (keep_best.py's headless-only calls —
    # Laplacian variance, grayscale imread — work identically either way). See ADR-0019.
    "onnxruntime>=1.27",             # MIT — CLIP + MiniLM inference (Wave 1 P0-B) and (via
    # rapidocr-onnxruntime, already a transitive dependency) OCR — one shared runtime for
    # every ONNX model this project uses, not a second payment.
    "numpy>=1.26",                 # BSD-3-Clause — cosine-similarity math (text_embeddings.py,
    # Feature 1b) and clutter-ranker feature-array construction (clutter_ranker.py, ADR-0021);
    # already a transitive dependency of onnxruntime/lightgbm, listed explicitly since it's
    # imported directly via `require()`, not just relied on indirectly.
    "lightgbm>=4.7.0",              # MIT — generic clutter-likelihood LambdaMART ranker
    # (Feature 3/ADR-0021). Zero GPU requirement, CPU training/inference — satisfies the
    # zero-cost/local-first default same as every other AI-layer dependency.
    "faiss-cpu>=1.14.3",             # MIT — ANN cosine-similarity search over CLIP embeddings.
    # hnswlib (the spec's other named option) was tried first and rejected on pip-
    # installability grounds: it has no prebuilt wheel for this Python/platform combination
    # and needs to compile from source, requiring MSVC Build Tools (not installed) — exactly
    # the "needs a system binary" problem this project's dependency discipline avoids
    # (same reasoning that chose rapidocr-onnxruntime over Tesseract for Feature 2).
    # faiss-cpu ships a prebuilt Windows wheel, zero extra setup.
]
# Wave 1 P0-B: NOT part of the normal dev/runtime install, NOT needed to build or run Reclaim
# — only to regenerate `reclaim/ai/models/*.onnx` from the original torch checkpoints (e.g. if
# the pinned upstream revision ever changes). `uv sync --extra ai-export` then
# `uv run python scripts/export_ai_models.py`. Deliberately kept out of `ai` above so a normal
# `uv sync --extra ai` (what end users effectively get via the installer, and what every other
# dev workflow uses) never pulls torch back in.
ai-export = [
    "torch>=2.0",                     # Apache-2.0/BSD/MIT component mix — see the `ai` group's
    # pre-P0-B history for the full license/rejection rationale (unchanged, just scoped to
    # this export-only group now).
    "open-clip-torch>=3.3.0",         # MIT — source of the CLIP checkpoint being converted.
    "sentence-transformers>=3.0",     # Apache-2.0 — source of the MiniLM checkpoint being
    # converted (also exports the WordPiece `tokenizer.json` bundled under `ai/models/`).
    "onnx>=1.22",                     # Apache-2.0 — ONNX graph format/tooling.
    "onnxscript>=0.7",                 # MIT — required by torch's ONNX exporter (torch>=2.9's
    # dynamo-based `torch.onnx.export` path).
    "onnxconverter-common>=1.16",     # MIT — fp16 conversion (`float16.convert_float_to_
    # float16`), used for the CLIP export specifically (see image_embeddings.py's module
    # docstring for why CLIP ships fp16, not int8).
    "huggingface-hub>=0.35",           # Apache-2.0 — pinned-revision checkpoint download +
    # sha256 integrity verification (ADR-0028), used directly by this export script now that
    # it's the only place in the codebase still downloading the original torch checkpoints.
]

[project.scripts]
reclaim = "reclaim.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
    "mypy>=1.13",
    "pyarrow>=17.0",  # Apache-2.0 — reads the PAWS-Wiki gold-set parquet files
    # (ADR-0017's measurement tooling only, never imported by src/reclaim/**)
    "ollama>=0.6.2",  # MIT — local-LLM labeling client (evals/ai_fixtures/ranker_llm_judge.py,
    # ADR-0021 measurement tooling only, never imported by src/reclaim/**). Talks exclusively
    # to a local Ollama server (http://localhost:11434) — zero paid API, ANTHROPIC_API_KEY
    # never read or set anywhere this package is used.
    "nuitka>=4.1.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "T20", "DTZ", "PTH", "TRY", "RUF"]
ignore = [
    "TRY003", # long messages inside typed exception classes are fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S104"]   # assert/temp paths in fixtures; S104 fires on the
                                         # literal "0.0.0.0" strings these tests assert get
                                         # REJECTED, not bound to (see test_cli.py's bind-gate
                                         # tests) — the rule can't distinguish the two contexts.
"evals/**" = ["S101", "S108"]
"scripts/**" = ["T201"]                 # print() is fine in operational scripts

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["reclaim"]
mypy_path = "src"

# send2trash ships no py.typed/stub package (unlike blake3, which does) — ignoring missing
# imports for just this module rather than installing a types-Send2Trash dev dependency.
[[tool.mypy.overrides]]
module = "send2trash.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "scale: real-disk-scale-tier tests (evals/test_e2e_scale.py's 100k+ file tier) -- slow, not selected by default; run explicitly via `pytest -m scale`.",
]

[tool.coverage.run]
source = ["src/reclaim"]
omit = ["src/reclaim/cli.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
